[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "retainpdf-pipeline"
version = "4.2.5"
description = "RetainPDF OCR, translation, and rendering pipeline"
requires-python = ">=3.11"
dependencies = [
  "Pillow==10.4.0",
  "PyMuPDF==1.26.5",
  "pikepdf>=8,<10",
  "requests==2.32.5",
  "urllib3==2.5.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.3",
  # 只用来在测试里检查产出的 docx；文档现在由 retainpdf2doc（Node）生成。
  "python-docx==1.1.2",
]

[project.scripts]
retainpdf-pipeline = "retainpdf_pipeline.entrypoints.console:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "retainpdf_pipeline*",
]
namespaces = true

[tool.setuptools.package-data]
"retainpdf_pipeline.translate.prompts" = ["*.txt", "*.md"]
"retainpdf_pipeline.ocr.document_schema" = ["*.json"]
"retainpdf_pipeline.foundation.shared" = ["*.json"]

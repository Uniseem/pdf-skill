[project]
name = "pdfskill"
version = "0.1.0"
description = "Agent skill: ingest any document into a flat, git-friendly Markdown library (MinerU + LLM), BM25 search, and layout-preserving PDF translation (retain-pdf)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Uniseem" }]
requires-python = ">=3.11"
keywords = ["agent-skill", "mineru", "pdf", "markdown", "bm25", "rag", "translation", "retain-pdf"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "bm25s>=0.3,<0.4",
    "dukpy>=0.6",
    "httpx>=0.27",
    "json-repair>=0.40",
    "markdown-it-py>=4,<5",
    "mdformat>=1.0,<2",
    "mdformat-gfm>=1.0",
    "mdit-py-plugins>=0.5",
    "numpy>=1.24",
    "openai>=1.60,<4",
    "pymarkdownlnt==0.9.40",
    "pystemmer>=2.2",
    "rapidfuzz>=3",
]

[project.urls]
Homepage = "https://github.com/Uniseem/pdf-skill"
Issues = "https://github.com/Uniseem/pdf-skill/issues"

[project.scripts]
pdfskill = "pdfskill.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfskill"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.sdist]
exclude = ["**/__pycache__", "**/*.pyc", ".github"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
extend-exclude = ["src/pdfskill/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
